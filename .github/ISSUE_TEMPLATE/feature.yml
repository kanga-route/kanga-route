name: 🚀 Feature Request
description: Propose a new feature, CRM write-back property, or enhancement for Kanga-Route.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Kanga-Route!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: e.g., Currently, we cannot easily distinguish between soft bounces and rate-limited connections...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear description of what you want to happen or how the engine/CLI should behave.
      placeholder: Add a new custom property flag or CLI command option...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the Kanga-Route architecture does this target?
      options:
        - Python Verification Engine (Regex, DNS, SMTP)
        - DynamoDB Caching Layer
        - HubSpot Integration / Properties
        - CLI Control Plane (`kanga-route`)
        - Packer Machine Image / Docker Stack
        - Pulumi Infrastructure
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or API references here.