name: Pull Request CI & Test Suite

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Run Pytest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: src
        run: pytest --verbose

  validate-packer:
    name: Validate Packer Appliance Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: 'latest'

      - name: Initialize Packer Plugins
        run: packer init packer/kanga-route.pkr.hcl

      - name: Validate Packer Template
        run: packer validate packer/kanga-route.pkr.hcl

  validate-infrastructure:
    name: Check Pulumi IaC Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Check Pulumi Infrastructure Syntax
        run: python -m compileall infra/