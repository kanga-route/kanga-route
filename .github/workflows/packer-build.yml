name: Packer Appliance Bakery & Release Promotion

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag / Release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      promote_to_latest_stable:
        description: 'Promote newly baked AMI ID as Latest Stable/Validated in documentation'
        required: true
        type: boolean
        default: false

jobs:
  packer-build:
    name: Build Kanga-Route Appliance AMI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Target Version Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version_tag }}
          fetch-depth: 0

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: 'latest'

      - name: Initialize Packer Plugins
        run: packer init packer/kanga-route.pkr.hcl

      - name: Validate Packer Template
        run: packer validate packer/kanga-route.pkr.hcl

      - name: Build AMI Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          packer build \
            -var "aws_region=us-east-1" \
            -var "aws_access_key=${AWS_ACCESS_KEY_ID}" \
            -var "aws_secret_key=${AWS_SECRET_ACCESS_KEY}" \
            packer/kanga-route.pkr.hcl

      - name: Upload Candidate Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packer-candidate-manifest-${{ github.event.inputs.version_tag }}
          path: packer-manifest.json

      - name: Prune Expired AMIs (AWS Cost Optimization)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install boto3
          python3 scripts/cleanup_old_amis.py us-east-1

      - name: Promote AMI ID to Production Documentation (Gated Step)
        if: github.event.inputs.promote_to_latest_stable == 'true'
        run: |
          if [ -f packer-manifest.json ]; then
            echo "Promoting AMI ID for version ${{ github.event.inputs.version_tag }} to master branch documentation..."
            
            git fetch origin master
            git checkout master
            python3 scripts/promote_ami.py "${{ github.event.inputs.version_tag }}"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md docs/setup.md
            git diff --staged --quiet || git commit -m "docs: promote AMI for ${{ github.event.inputs.version_tag }} as latest production release"
            git push origin master
          fi
