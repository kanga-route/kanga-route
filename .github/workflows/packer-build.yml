name: Packer Appliance Bakery & Release Promotion

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag / Release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      promote_to_latest_stable:
        description: 'Promote newly baked AMI ID as Latest Stable/Validated in documentation'
        required: true
        type: boolean
        default: false

jobs:
  packer-build:
    name: Build Kanga-Route Appliance AMI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Target Version Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version_tag }}
          fetch-depth: 0

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: 'latest'

      - name: Initialize Packer Plugins
        run: packer init packer/kanga-route.pkr.hcl

      - name: Validate Packer Template
        run: packer validate packer/kanga-route.pkr.hcl

      - name: Build AMI Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          packer build \
            -var "aws_region=us-east-1" \
            -var "aws_access_key=${AWS_ACCESS_KEY_ID}" \
            -var "aws_secret_key=${AWS_SECRET_ACCESS_KEY}" \
            packer/kanga-route.pkr.hcl

      - name: Upload Candidate Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packer-candidate-manifest-${{ github.event.inputs.version_tag }}
          path: packer-manifest.json

      - name: Promote AMI ID to Production Documentation (Gated Step)
        if: github.event.inputs.promote_to_latest_stable == 'true'
        run: |
          if [ -f packer-manifest.json ]; then
            NEW_AMI=$(python3 -c "import json; data=json.load(open('packer-manifest.json')); print(data['builds'][-1]['artifact_id'].split(':')[-1])")
            VER="${{ github.event.inputs.version_tag }}"
            echo "Promoting AMI ID $NEW_AMI for version $VER to master branch documentation..."
            
            if [ -n "$NEW_AMI" ] && [[ "$NEW_AMI" =~ ^ami- ]]; then
              # Switch from detached HEAD state to tracking master branch
              git fetch origin master
              git checkout master
              
              # Execute safe table row prepend without replacing historical catalog rows
              python3 -c "
          import json, re

          manifest = json.load(open('packer-manifest.json'))
          new_ami = manifest['builds'][-1]['artifact_id'].split(':')[-1]
          ver = '$VER'

          # 1. Update README.md catalog table safely
          readme = open('README.md').read()
          if ver in readme:
              readme = re.sub(
                  rf'\| \*\*{re.escape(ver)}\*\* \| [^|]+ \| ([^|]+) \| \*\*ami-[a-z0-9]+\*\* \|',
                  f'| **\`{ver}\`** | **Latest (Production)** | \\1 | **\`{new_ami}\`** |',
                  readme
              )
          else:
              readme = readme.replace('**Latest (Production)**', '\`Supported\`')
              new_row = f'| **\`{ver}\`** | **Latest (Production)** | \`us-east-1\` (N. Virginia) | **\`{new_ami}\`** | [**Launch {ver} Appliance 🚀**](https://console.aws.amazon.com/ec2/v2/home?region=us-east-1#LaunchInstances:amiId={new_ami}) |\n'
              header = '| Version | Release Status | AWS Region | AMI ID | Quick Launch |\n|---|---|---|---|---|\n'
              readme = readme.replace(header, header + new_row)
          open('README.md', 'w').write(readme)

          # 2. Update docs/setup.md launch link
          setup = open('docs/setup.md').read()
          setup = re.sub(r'ami-[a-z0-9]+', new_ami, setup)
          open('docs/setup.md', 'w').write(setup)
          "
              
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md docs/setup.md
              git diff --staged --quiet || git commit -m "docs: promote AMI $NEW_AMI ($VER) as latest production release"
              git push origin master
            fi
          fi
