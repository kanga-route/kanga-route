name: Packer Appliance Bakery & Release Promotion

on:
  workflow_dispatch:
    inputs:
      promote_to_readme:
        description: 'Promote newly baked AMI ID to README.md and docs'
        required: true
        type: boolean
        default: false
  release:
    types: [published]

jobs:
  packer-build:
    name: Build Kanga-Route Appliance AMI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: 'latest'

      - name: Initialize Packer Plugins
        run: packer init packer/kanga-route.pkr.hcl

      - name: Validate Packer Template
        run: packer validate packer/kanga-route.pkr.hcl

      - name: Build AMI Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          packer build \
            -var "aws_region=us-east-1" \
            -var "aws_access_key=${AWS_ACCESS_KEY_ID}" \
            -var "aws_secret_key=${AWS_SECRET_ACCESS_KEY}" \
            packer/kanga-route.pkr.hcl

      - name: Upload Candidate Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packer-candidate-manifest
          path: packer-manifest.json

      - name: Promote AMI ID to README.md (Gated Step)
        if: github.event_name == 'release' || github.event.inputs.promote_to_readme == 'true'
        run: |
          if [ -f packer-manifest.json ]; then
            NEW_AMI=$(python3 -c "import json; data=json.load(open('packer-manifest.json')); print(data['builds'][-1]['artifact_id'].split(':')[-1])")
            echo "Promoting AMI ID to production documentation: $NEW_AMI"
            
            if [ -n "$NEW_AMI" ] && [[ "$NEW_AMI" =~ ^ami- ]]; then
              sed -i -E "s/ami-[a-z0-9]+/$NEW_AMI/g" README.md docs/setup.md
              
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md docs/setup.md
              git diff --staged --quiet || git commit -m "docs: promote production AMI ID to $NEW_AMI"
              git push origin master || true
            fi
          fi
