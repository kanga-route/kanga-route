services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanga-route-engine
    env_file:
      - .env
    environment:
      - USE_LOCAL_DB=true
      - DYNAMODB_ENDPOINT_URL=${DYNAMODB_ENDPOINT_URL:-http://dynamodb-local:8000}
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-KangaRouteCache}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy}
    depends_on:
      dynamodb-local:
        condition: service_started

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: kanga-route-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
    driver: local
