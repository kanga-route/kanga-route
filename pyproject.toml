[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanga-route"
version = "0.1.0"
description = "Containerized Virtual Appliance email verification and routing engine for HubSpot"
authors = [{name = "Seth Hereford"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "dnspython>=2.4.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
kanga-route-engine = "kanga_route.main:main"
kanga-route-verify = "kanga_route.application.cli:main"
kanga-route-web = "kanga_route.web.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kanga_route.web" = ["static/*"]
